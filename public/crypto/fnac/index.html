<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Five Nights at Crypto's — Crypto 101 Bonus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=Hanken+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000000; --panel:#0d0c0a; --panel2:#141210; --edge:#2a2620;
    --ink:#e8e2d4; --dim:#7a7466;
    --accent:#b23a26; --gold:#c79338; --ok:#62ab77;
    --disp:"Fraunces",Georgia,serif; --ui:"Hanken Grotesk",system-ui,sans-serif;
    --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0; color:var(--ink); font-family:var(--ui); background:var(--bg); min-height:100vh; padding:40px 18px 90px}
  .wrap{max-width:780px; margin:0 auto}
  header{border-bottom:2px solid var(--edge); padding-bottom:18px; margin-bottom:26px}
  h1{font-family:var(--disp); font-weight:900; font-size:clamp(2.1rem,6.5vw,3.3rem); line-height:.96; margin:0; color:var(--ink)}
  h1 em{font-style:italic; font-weight:400; color:var(--accent)}
  header p{font-family:var(--disp); font-size:1.02rem; line-height:1.5; opacity:.8; margin:12px 0 0; max-width:56ch}

  .locked{font-family:var(--mono); font-size:.9rem; color:var(--dim); text-align:center; padding:80px 20px}

  .grid{display:grid; gap:18px}
  .stage{background:var(--panel); border:1px solid var(--edge); border-radius:8px; padding:20px 22px}
  .stage.placeholder{opacity:.45}

  .stage h2{font-family:var(--disp); font-size:1.4rem; margin:6px 0 10px}
  .raw-html{font-family:serif; color:#000; background:#fff; padding:16px; border:none}

  .dropzone{font-family:var(--mono); font-size:.78rem; color:var(--dim); border:1px dashed var(--edge);
    border-radius:6px; padding:20px; text-align:center; cursor:pointer}
  .dropzone.over{border-color:var(--gold); color:var(--gold)}
  .hexdump{font-family:var(--mono); font-size:.72rem; line-height:1.5; color:var(--ink); background:#000;
    border:1px solid var(--edge); border-radius:5px; padding:12px; white-space:pre; overflow:auto; max-height:280px}
  .meta-table{font-family:var(--mono); font-size:.76rem; color:var(--ink); background:#000;
    border:1px solid var(--edge); border-radius:5px; width:100%; border-collapse:collapse}
  .meta-table td{padding:6px 10px; border-bottom:1px solid var(--edge)}
  .meta-table td:first-child{color:var(--gold)}
  .bp-canvas{image-rendering:pixelated; max-width:100%; border:1px solid var(--edge); border-radius:4px}

<body>
<div class="wrap" id="app"></div>
<script>
function ctfUid(){
  const m=document.cookie.match(/(?:^|; )ctf-uid=([^;]+)/); if(m) return m[1];
  const v=Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
  document.cookie='ctf-uid='+v+';path=/;max-age=31536000;samesite=lax'; return v;
}
const fnv=s=>{ let h=2166136261>>>0; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619);} return h>>>0; };
ctfUid(); // ensures the shared ctf-uid cookie exists before the confetti engine seeds off it
window.FX_TOTAL = 7; // matches STAGES.length — confetti fires once all 7 nights are real+solved

function unlocked(){ return document.cookie.match(/(?:^|; )ctf-fnac-unlocked=1(?:;|$)/); }

const app = document.getElementById('app');

function renderModule(){
  app.innerHTML = `
    <header>
      <h1>Five Nights at <em>Crypto's</em></h1>
      <p>You made it through. This part isn't graded like the rest — it's what's left running after
         hours. Same tools, worse lighting.</p>
    </header>
    <div class="raw-html"><p>visitor log — do not remove<br>everything past this point is off the books.</p></div>
    <div class="grid" id="stages"></div>
    <div class="reset-row" style="display:flex;justify-content:center;margin:48px 0 36px">
      <button id="reset-mod" style="font-family:var(--mono);font-size:.66rem;letter-spacing:.16em;cursor:pointer;color:var(--dim);background:none;border:1px solid var(--edge);border-radius:6px;padding:8px 14px">RESET MODULE</button>
    </div>
  `;
  renderStages();
  wireResetButton();
}

function wireResetButton(){
  const btn=document.getElementById('reset-mod'); if(!btn) return;
  let armed=false, t;
  btn.addEventListener('click', ()=>{
    if(!armed){ armed=true; btn.textContent='CONFIRM — ERASE PROGRESS?';
      t=setTimeout(()=>{ armed=false; btn.textContent='RESET MODULE'; }, 3500); }
    else { clearTimeout(t); if(window.fxReset) window.fxReset();
      try{ localStorage.removeItem('ctf-solved:v2:fnac'); }catch(e){} location.reload(); }
  });
}

// small deterministic rotation per stage id, stable across reloads — "slightly off," not jittery
function seededRotation(id){ return (fnv('rot:'+id) % 500) / 100 - 2.5; } // -2.5deg .. +2.5deg

const STAGES = [
  {id:'night1', title:'Night 1 · Static', ready:true},
  {id:'night2', title:'Night 2 · Raw Bit Weaving', ready:true},
  {id:'night3', title:'Night 3 · Tung Tung Tung Sahur', ready:true},
  {id:'night4', title:'Night 4', ready:false},
  {id:'night5', title:'Night 5', ready:false},
  {id:'nightmare', title:'Nightmare', ready:false},
  {id:'abyss', title:'Abyss', ready:false},
];

function renderStages(){
  const wrap = document.getElementById('stages');
  STAGES.forEach(s=>{
    const el = document.createElement('div');
    el.className = 'stage' + (s.ready ? '' : ' placeholder');
    el.style.transform = `rotate(${seededRotation(s.id)}deg)`;
    el.id = 'stage-' + s.id;
    if(s.ready){
      el.innerHTML = `<div class="lab">${s.id}</div><h2>${s.title}</h2><div class="body"></div>`;
    } else {
      el.innerHTML = `<div class="lab">${s.id}</div><h2>${s.title}</h2><div class="body" style="font-family:var(--mono);font-size:.8rem;color:var(--dim)">not yet.</div>`;
    }
    wrap.appendChild(el); // append BEFORE wiring — builders look up this element by id via getElementById
    if(s.ready){
      const body = el.querySelector('.body');
      if(s.id === 'night1') buildNight1(body);
      if(s.id === 'night2') buildNight2(body);
      if(s.id === 'night3') buildNight3(body);
    }
  });
}

// ---- shared decode helpers (Task 6) ----
const toBytes = s => { const u=new Uint8Array(s.length); for(let i=0;i<s.length;i++) u[i]=s.charCodeAt(i)&255; return u; };
const toStr = b => { let s=''; for(let i=0;i<b.length;i++) s+=String.fromCharCode(b[i]); return s; };
const printable = s => s.replace(/[^\x20-\x7E\n]/g,'·');

function readFileAsBytes(file){
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = ()=>resolve(new Uint8Array(r.result));
    r.onerror = ()=>reject(r.error);
    r.readAsArrayBuffer(file);
  });
}

// strictAscii also dots out CR/LF so rows stay aligned when the data is binary.
// Night 1's viewers keep the original (newline-passing) behaviour untouched.
function bytesToHexDump(bytes, bytesPerRow=16, strictAscii=false){
  let out = '';
  for(let row=0; row*bytesPerRow < bytes.length; row++){
    const start = row*bytesPerRow;
    const chunk = bytes.slice(start, start+bytesPerRow);
    const hex = Array.from(chunk).map(b=>b.toString(16).padStart(2,'0')).join(' ').padEnd(bytesPerRow*3-1,' ');
    const raw = toStr(chunk);
    const ascii = strictAscii ? raw.replace(/[^\x20-\x7E]/g,'·') : printable(raw);
    out += start.toString(16).padStart(6,'0') + '  ' + hex + '  ' + ascii + '\n';
  }
  return out;
}

// strictAscii is opt-in per call site: Night 2's halves are binary and contain 0x0a bytes that
// would otherwise emit real newlines and shatter the dump's row alignment. Night 1 keeps the
// original rendering (its call sites pass nothing).
function mountRawBytesViewer(container, onBytes, strictAscii){
  container.innerHTML = `<div class="dropzone">drop a file here (stands in for <b>xxd</b>) — or click to choose</div><div class="hexdump" style="display:none"></div>`;
  const zone = container.querySelector('.dropzone');
  const dump = container.querySelector('.hexdump');
  const input = document.createElement('input'); input.type='file'; input.style.display='none';
  container.appendChild(input);

  async function handle(file){
    if(!file) return;
    try{
      const bytes = await readFileAsBytes(file);
      dump.style.display = 'block';
      dump.textContent = bytesToHexDump(bytes, 16, !!strictAscii);
      if(onBytes) onBytes(bytes);
    }catch(e){
      dump.style.display = 'block';
      dump.textContent = "couldn't read that file.";
    }
  }
  zone.addEventListener('click', ()=>input.click());
  input.addEventListener('change', ()=>handle(input.files[0]));
  zone.addEventListener('dragover', e=>{ e.preventDefault(); zone.classList.add('over'); });
  zone.addEventListener('dragleave', ()=>zone.classList.remove('over'));
  zone.addEventListener('drop', e=>{ e.preventDefault(); zone.classList.remove('over'); handle(e.dataTransfer.files[0]); });
}

// ---- Metadata Viewer widget (Task 7) ----
// RESERVED: not mounted by any current night. Kept deliberately — the design spec
// (docs/superpowers/specs/2026-08-11-five-nights-at-cryptos-design.md) lists the exiftool
// stand-in as shared tooling for the unbuilt Nights 4+, alongside the bit-plane viewer below.
function parsePngTextChunks(bytes){
  const out = {};
  const sig = [0x89,0x50,0x4E,0x47,0x0D,0x0A,0x1A,0x0A];
  for(let i=0;i<8;i++) if(bytes[i]!==sig[i]) return out; // not a PNG — return empty, never throw
  let pos = 8;
  const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  while(pos + 8 <= bytes.length){
    const length = dv.getUint32(pos);
    const type = toStr(bytes.slice(pos+4,pos+8));
    const data = bytes.slice(pos+8, pos+8+length);
    if(type === 'tEXt'){
      const nul = data.indexOf(0);
      if(nul >= 0) out[toStr(data.slice(0,nul))] = toStr(data.slice(nul+1));
    }
    pos += 12 + length;
    if(type === 'IEND') break;
  }
  return out;
}

function mountMetadataViewer(container){
  container.innerHTML = `<div class="dropzone">drop a file here (stands in for <b>exiftool</b>) — or click to choose</div><div></div>`;
  const zone = container.querySelector('.dropzone');
  const resultBox = container.querySelector('div:last-child');
  const input = document.createElement('input'); input.type='file'; input.style.display='none';
  container.appendChild(input);

  async function handle(file){
    if(!file) return;
    try{
      const bytes = await readFileAsBytes(file);
      const fields = parsePngTextChunks(bytes);
      const keys = Object.keys(fields);
      if(!keys.length){ resultBox.textContent = 'no text metadata found.'; return; }
      const table = document.createElement('table'); table.className='meta-table';
      keys.forEach(k=>{ const tr=document.createElement('tr');
        tr.innerHTML = `<td>${k}</td><td>${fields[k]}</td>`; table.appendChild(tr); });
      resultBox.innerHTML = ''; resultBox.appendChild(table);
    }catch(e){
      resultBox.textContent = "couldn't read that file.";
    }
  }
  zone.addEventListener('click', ()=>input.click());
  input.addEventListener('change', ()=>handle(input.files[0]));
  zone.addEventListener('dragover', e=>{ e.preventDefault(); zone.classList.add('over'); });
  zone.addEventListener('dragleave', ()=>zone.classList.remove('over'));
  zone.addEventListener('drop', e=>{ e.preventDefault(); zone.classList.remove('over'); handle(e.dataTransfer.files[0]); });
}

// ---- Bit-Plane / LSB Viewer widget (Task 8) ----
// RESERVED: not mounted by any current night (see the note on the metadata viewer above) —
// the zsteg stand-in is spec'd shared tooling held for the unbuilt Nights 4+.
function extractLsbMessage(imageData, maxLen=4096){
  const d = imageData.data; // RGBA, one pixel = 4 bytes, R channel is index 0 of each pixel
  const bit = i => d[i*4] & 1;
  let lengthBits = '';
  for(let i=0;i<32;i++) lengthBits += bit(i);
  const length = Math.min(parseInt(lengthBits,2) || 0, maxLen);
  const bytes = new Uint8Array(length);
  for(let by=0; by<length; by++){
    let byteBits = '';
    for(let bi=0; bi<8; bi++) byteBits += bit(32 + by*8 + bi);
    bytes[by] = parseInt(byteBits,2);
  }
  return bytes;
}

function mountBitPlaneViewer(container){
  container.innerHTML = `<div class="dropzone">drop an image here (stands in for <b>zsteg</b>) — or click to choose</div>
    <canvas class="bp-canvas" style="display:none"></canvas><div class="hexdump" style="display:none"></div>`;
  const zone = container.querySelector('.dropzone');
  const canvas = container.querySelector('canvas');
  const dump = container.querySelector('.hexdump');
  const input = document.createElement('input'); input.type='file'; input.style.display='none';
  container.appendChild(input);

  function handle(file){
    if(!file) return;
    const img = new Image();
    img.onload = ()=>{
      canvas.width = img.width; canvas.height = img.height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img,0,0);
      canvas.style.display = 'block';
      try{
        const imageData = ctx.getImageData(0,0,canvas.width,canvas.height);
        const bytes = extractLsbMessage(imageData);
        dump.style.display = 'block';
        dump.textContent = 'R-channel LSB, first bits: ' + printable(toStr(bytes));
      }catch(e){
        dump.style.display = 'block';
        dump.textContent = "couldn't read that image.";
      }
    };
    img.onerror = ()=>{ dump.style.display='block'; dump.textContent = "couldn't read that as an image."; };
    img.src = URL.createObjectURL(file);
  }
  zone.addEventListener('click', ()=>input.click());
  input.addEventListener('change', ()=>handle(input.files[0]));
  zone.addEventListener('dragover', e=>{ e.preventDefault(); zone.classList.add('over'); });
  zone.addEventListener('dragleave', ()=>zone.classList.remove('over'));
  zone.addEventListener('drop', e=>{ e.preventDefault(); zone.classList.remove('over'); handle(e.dataTransfer.files[0]); });
}

// ---- shared drop-target wiring: click-to-choose + drag-and-drop, one hidden input each ----
function wireDropTarget(zone, onFile){
  const input = document.createElement('input');
  input.type = 'file'; input.style.display = 'none';
  input.className = zone.dataset.inputClass || '';
  zone.parentNode.insertBefore(input, zone.nextSibling);
  zone.addEventListener('click', ()=>input.click());
  input.addEventListener('change', ()=>{ if(input.files[0]) onFile(input.files[0]); });
  zone.addEventListener('dragover', e=>{ e.preventDefault(); zone.classList.add('over'); });
  zone.addEventListener('dragleave', ()=>zone.classList.remove('over'));
  zone.addEventListener('drop', e=>{ e.preventDefault(); zone.classList.remove('over');
    if(e.dataTransfer.files[0]) onFile(e.dataTransfer.files[0]); });
  return input;
}

// ---- Night 2: bit-weave tool ----
// Inverse of tools/fnac_png.py bit_split(). Bits in a source byte are numbered 7 (MSB)..0 (LSB).
// Half A holds the even-indexed bits in the order 6,4,2,0; half B the odd-indexed bits 7,5,3,1.
// One source byte = one nibble in each half; source byte 0 is the HIGH nibble of output byte 0,
// source byte 1 the LOW nibble of output byte 0, and so on.
function weaveHalves(a, b){
  if(a.length !== b.length) throw new Error('length mismatch');
  const out = new Uint8Array(a.length * 2);
  for(let i=0;i<out.length;i++){
    const idx = i >> 1;
    const nibA = (i % 2 === 0) ? (a[idx] >> 4) & 15 : a[idx] & 15;
    const nibB = (i % 2 === 0) ? (b[idx] >> 4) & 15 : b[idx] & 15;
    let byte = 0;
    [6,4,2,0].forEach((bit,pos)=>{ byte |= ((nibA >> (3-pos)) & 1) << bit; });
    [7,5,3,1].forEach((bit,pos)=>{ byte |= ((nibB >> (3-pos)) & 1) << bit; });
    out[i] = byte;
  }
  return out;
}

const PNG_SIG_JS = [0x89,0x50,0x4E,0x47,0x0D,0x0A,0x1A,0x0A];
const looksLikePng = b => b.length > 8 && PNG_SIG_JS.every((v,i)=>b[i]===v);

function mountWeaveTool(container){
  container.innerHTML = `
    <div style="display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))">
      <div><div class="dropzone zone-a">drop <b>file-a.bin</b> here — or click</div></div>
      <div><div class="dropzone zone-b">drop <b>file-b.bin</b> here — or click</div></div>
    </div>
    <div class="weave-msg" style="font-family:var(--mono);font-size:.74rem;color:var(--dim);margin-top:8px"></div>
    <img class="weave-img" alt="" style="display:none;max-width:240px;width:100%;margin-top:10px;border:1px solid var(--edge);border-radius:6px;background:#fff">
    <div class="hexdump weave-dump" style="display:none;margin-top:8px"></div>`;
  const msg = container.querySelector('.weave-msg');
  const img = container.querySelector('.weave-img');
  const dump = container.querySelector('.weave-dump');
  const zoneA = container.querySelector('.zone-a');
  const zoneB = container.querySelector('.zone-b');
  zoneA.dataset.inputClass = 'weave-in-a';
  zoneB.dataset.inputClass = 'weave-in-b';
  let bytesA = null, bytesB = null, url = null;

  function say(text, warn){
    msg.textContent = text;
    msg.style.color = warn ? 'var(--accent)' : 'var(--dim)';
  }

  function attempt(){
    if(!bytesA || !bytesB){ say('waiting for both halves.'); return; }
    let woven;
    try{ woven = weaveHalves(bytesA, bytesB); }
    catch(e){
      say(`those two files aren't the same size (${bytesA.length} vs ${bytesB.length}) — the halves should match.`, true);
      img.style.display='none'; dump.style.display='none';
      return;
    }
    dump.style.display = 'block';
    dump.textContent = bytesToHexDump(woven, 16, true);
    if(url){ URL.revokeObjectURL(url); url = null; }
    if(!looksLikePng(woven)){
      img.style.display = 'none';
      let swapped = false;
      try{ swapped = looksLikePng(weaveHalves(bytesB, bytesA)); }catch(e){}
      say(swapped ? "that came out without a PNG header — but it does if you swap A and B. Try the other way round."
                  : "that came out without a PNG header, so it isn't an image yet. Check you dropped the right two files.", true);
      return;
    }
    url = URL.createObjectURL(new Blob([woven], {type:'image/png'}));
    img.onerror = ()=>{ img.style.display='none'; say("the bytes weave together, but nothing will render them.", true); };
    img.onload = ()=>{ img.style.display='block'; };
    img.src = url;
    say(`${woven.length} bytes woven back together. Read the dump to the end.`);
  }

  async function take(which, file){
    try{
      const bytes = await readFileAsBytes(file);
      if(which === 'a') bytesA = bytes; else bytesB = bytes;
      (which === 'a' ? zoneA : zoneB).textContent = `${file.name} — ${bytes.length} bytes`;
      attempt();
    }catch(e){ say("couldn't read that file.", true); }
  }
  wireDropTarget(zoneA, f=>take('a', f));
  wireDropTarget(zoneB, f=>take('b', f));
}

// ---- Night 3: repeating-key XOR / crib tool ----
function xorRepeating(bytes, key){
  const out = new Uint8Array(bytes.length);
  for(let i=0;i<bytes.length;i++) out[i] = bytes[i] ^ key[i % key.length];
  return out;
}
const hexOf = b => Array.from(b).map(v=>v.toString(16).padStart(2,'0')).join(' ');
// derived key bytes are student-controlled — a crib byte can XOR to '<' and eat the rest of the line
const escHtml = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function mountXorTool(container, cipherUrl){
  container.innerHTML = `
    <div class="hexdump xor-cipher" style="max-height:150px">loading the message…</div>
    <label style="display:block;font-family:var(--mono);font-size:.7rem;color:var(--dim);margin-top:12px">CRIB — text you think the message starts with</label>
    <input class="xor-crib" placeholder="flag{" autocapitalize="none" autocorrect="off" autocomplete="off" spellcheck="false" style="width:100%;font-family:var(--mono);background:#000;color:var(--gold);border:1px solid var(--edge);border-radius:6px;padding:9px;margin-top:5px">
    <div class="xor-crib-out" style="font-family:var(--mono);font-size:.76rem;color:var(--ink);margin-top:6px"></div>
    <label style="display:block;font-family:var(--mono);font-size:.7rem;color:var(--dim);margin-top:12px">KEY — repeated over the whole message</label>
    <input class="xor-key" placeholder="type a key…" autocapitalize="none" autocorrect="off" autocomplete="off" spellcheck="false" style="width:100%;font-family:var(--mono);background:#000;color:var(--gold);border:1px solid var(--edge);border-radius:6px;padding:9px;margin-top:5px">
    <div class="hexdump xor-plain" style="white-space:pre-wrap;margin-top:6px;max-height:200px">—</div>`;
  const cipherBox = container.querySelector('.xor-cipher');
  const cribIn = container.querySelector('.xor-crib');
  const cribOut = container.querySelector('.xor-crib-out');
  const keyIn = container.querySelector('.xor-key');
  const plainBox = container.querySelector('.xor-plain');
  let cipher = null;

  function renderCrib(){
    const crib = toBytes(cribIn.value);
    if(!cipher || !crib.length){ cribOut.textContent = ''; return; }
    if(crib.length > cipher.length){ cribOut.textContent = "that crib is longer than the message."; return; }
    const keyBytes = xorRepeating(crib, cipher.slice(0, crib.length));
    cribOut.innerHTML = `key bytes implied at offset 0: <b style="color:var(--gold)">[${escHtml(printable(toStr(keyBytes)))}]</b>` +
      `<span style="color:var(--dim)"> &nbsp;hex ${hexOf(keyBytes)} &nbsp;(${keyBytes.length} bytes — mind the spaces)</span>`;
  }
  function renderPlain(){
    const key = toBytes(keyIn.value);
    if(!cipher){ plainBox.textContent = 'no message loaded.'; return; }
    if(!key.length){ plainBox.textContent = '—'; return; }
    plainBox.textContent = printable(toStr(xorRepeating(cipher, key)));
  }
  function setCipher(bytes){
    cipher = bytes;
    cipherBox.textContent = bytesToHexDump(cipher, 16, true);
    renderCrib(); renderPlain();
  }

  cribIn.addEventListener('input', renderCrib);
  keyIn.addEventListener('input', renderPlain);
  // arrayBuffer, never .text() — the ciphertext contains NULs and other non-UTF-8 bytes
  fetch(cipherUrl).then(r=>{
    if(!r.ok) throw new Error(r.status);
    return r.arrayBuffer();
  }).then(buf=>setCipher(new Uint8Array(buf)))
    .catch(()=>{ cipherBox.textContent = "couldn't load the message — download it and read it yourself."; });
}

// ---- shared flag-check helper (Task 9), used by every night ----
let storedFnacSolved = new Set();
try{ storedFnacSolved = new Set(JSON.parse(localStorage.getItem('ctf-solved:v2:fnac') || '[]')); }catch(e){}

function wireFlagCheck(bodyEl, stageId, answer){
  const input = bodyEl.querySelector('.flag-input');
  const verdict = bodyEl.querySelector('.verdict');
  const stageEl = document.getElementById('stage-' + stageId);
  function capture(){
    stageEl.classList.add('solved');
    verdict.textContent = 'correct — captured';
    verdict.style.color = 'var(--ok)';
    storedFnacSolved.add(stageId);
    try{ localStorage.setItem('ctf-solved:v2:fnac', JSON.stringify([...storedFnacSolved])); }catch(e){}
    if(window.fxSolved) window.fxSolved(stageId);
  }
  function check(){
    const v = input.value.trim();
    if(v.toLowerCase() === answer.toLowerCase()) capture();
    else if(v){ verdict.textContent = 'not it.'; verdict.style.color = 'var(--accent)'; }
  }
  bodyEl.querySelector('.flag-check').onclick = check;
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') check(); });
  if(storedFnacSolved.has(stageId)) capture();
}

// ---- konami code easter egg (unlocks the same way the cookie gate does) ----
(function(){
  const KONAMI = ['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'];
  let idx = 0;
  document.addEventListener('keydown', e=>{
    const expected = KONAMI[idx];
    const key = expected.length === 1 ? e.key.toLowerCase() : e.key;
    if(key === expected){
      idx++;
      if(idx === KONAMI.length){
        idx = 0;
        if(!unlocked()){
          document.cookie = 'ctf-fnac-unlocked=1;path=/;max-age=31536000;samesite=lax';
          renderModule();
        }
      }
    } else {
      idx = (key === KONAMI[0]) ? 1 : 0;
    }
  });
})();
