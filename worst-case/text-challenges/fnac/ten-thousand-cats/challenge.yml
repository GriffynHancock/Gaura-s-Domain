name: Ten Thousand Cats
author: Crypto 101
category: crypto
description: |
  Somebody's been feeding a stray. The photo's ordinary. That's the point. The flag
  is hidden in the least-significant bit of the red channel, one bit per pixel,
  row-major — a 4-byte big-endian length prefix comes first, then the ASCII flag.

files:
  - ../../../../public/crypto/fnac/assets/night3/cat-0.png

attribution: Crypto 101
type: dynamic

extra:
  initial: 500
  decay: 4
  function: linear
  minimum: 100

flags:
- type: static
  data: case_insensitive
  content: flag{ten_thousand_cats}

version: '0.1'
