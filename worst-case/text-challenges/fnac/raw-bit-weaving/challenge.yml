name: Bit Weaving
author: Crypto 101
category: crypto
description: |
  Something got taken apart in here. Not cut in half — taken apart smaller than that.
  Two files came out. Neither one opens, neither one is anything. Attach
  `night2-a.bin` and `night2-b.bin`, dump the raw bytes of each, and put it back together.

  Every byte of the original contributed four bits to each half: `night2-a.bin` holds bits
  6, 4, 2, 0 of each source byte, `night2-b.bin` holds bits 7, 5, 3, 1. Those four-bit
  groups are packed two-per-output-byte, high nibble first, in source order. Interleave
  them back and the original file appears — and it is a picture.

  Do not bother running `strings` on it. The flag is not in the bytes. Open the picture.

files:
  - ../../../../public/crypto/fnac/assets/night2/night2-a.bin
  - ../../../../public/crypto/fnac/assets/night2/night2-b.bin

attribution: Crypto 101
type: dynamic

extra:
  initial: 500
  decay: 4
  function: linear
  minimum: 100

flags:
- type: static
  data: case_insensitive
  content: flag{data_bender}

version: '0.1'
