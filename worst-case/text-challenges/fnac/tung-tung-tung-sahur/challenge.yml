name: Tung Tung Tung Sahur
author: Crypto 101
category: crypto
description: |
  It came down the hall at 3am, three knocks at a time, and left this behind. Every
  byte of it has been walked over by the same short secret, again and again. Whatever's
  out there doesn't hide its name. It shouts it.

  Attach `message.txt`. It is not text — every byte was XOR'd against a repeating key.
  You know one thing about the plaintext for free: it starts with `flag{`. XOR that
  against the first five bytes of the file and you have the first five characters of
  the key. Read them out loud and you'll know the rest.

  `hint-sahur.webp` is a picture of what left it.

  ```
  message.txt (118 bytes, hex):
  12 19 0f 00 5b 00 00 00 00 7f 00 00 00 00 7f 07
  14 06 12 2d 07 14 06 12 52 09 55 2f 47 53 1c 14
  1e 02 00 1a 0f 48 01 1a 11 55 06 06 4c 18 02 0f
  1e 0c 54 11 1c 06 47 14 08 06 12 52 15 55 0c 06
  54 5a 55 27 13 00 15 19 19 06 59 00 41 0b 1a 07
  1a 01 1d 47 54 1b 55 1a 0f 52 11 10 40 47 64 1c
  41 06 1a 06 54 17 0b 47 48 11 07 0b 47 46 1b 07
  4e 01 4f 06 13 46
  ```

files:
  - ../../../../public/crypto/fnac/assets/night3/message.txt
  - ../../../../public/crypto/fnac/assets/night3/hint-sahur.webp

attribution: Crypto 101
type: dynamic

extra:
