name: Decode the Signal
author: Crypto 101
category: crypto
description: |
  Encoding isn't a lock, it's a costume — reversible, no key needed. Recognise the
  disguise and take it off.

  ```
  ZmxhZ3tiYXNlNjRfaXNfbm90X3NlY3JldH0=
  ```
attribution: Crypto 101
type: dynamic

