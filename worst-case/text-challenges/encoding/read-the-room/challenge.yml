name: Read the Room
author: Crypto 101
category: crypto
description: |
  Decode `blob.txt` as base64 first. What comes out is still not language — it's two
  more layers deep, and each layer tells you what kind of nonsense you're holding.
  Then read carefully: the flag-shaped things you see aren't all the real flag.

files:
  - blob.txt

attribution: Crypto 101
type: dynamic

extra:
  initial: 500
  decay: 4
  function: linear
  minimum: 100

flags:
- type: static
  data: case_insensitive
  content: flag{read_every_line_first}

version: '0.1'
